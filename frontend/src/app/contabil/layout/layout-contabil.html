<div class="min-h-screen bg-desk">
  <aside class="fixed inset-y-0 left-0 flex w-sidebar flex-col border-r border-rule bg-desk">
    <div class="flex h-16 items-center px-6">
      <a
        routerLink="/contabil/zile-trimise"
        class="rounded-sm text-base font-semibold text-graphite outline-none focus-visible:ring-2 focus-visible:ring-pen"
      >
        Casa la Zi
      </a>
    </div>
    <nav aria-label="Navigare principală" class="px-3 pt-2">
      <ul class="flex flex-col gap-1">
        @for (item of items; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive
              #rla="routerLinkActive"
              ariaCurrentWhenActive="page"
              class="flex h-10 items-center gap-3 rounded-sm px-3 font-medium transition-colors outline-none focus-visible:ring-2 focus-visible:ring-pen"
              [class]="
                rla.isActive
                  ? 'bg-pen-wash text-pen'
                  : 'text-pencil hover:bg-pen-wash hover:text-graphite'
              "
            >
              <ng-icon [name]="item.icon" size="20" aria-hidden="true" />
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="mx-3 mt-3 border-t border-rule pt-3">
      <button
        type="button"
        class="flex h-10 w-full items-center gap-3 rounded-sm px-3 text-left font-medium text-pencil transition-colors outline-none hover:bg-pen-wash hover:text-graphite focus-visible:ring-2 focus-visible:ring-pen"
      >
        <ng-icon name="phosphorFileXls" size="20" aria-hidden="true" />
        Export în Excel
      </button>
    </div>

    <div class="mt-auto border-t border-rule px-6 py-4">
      <p class="font-medium text-graphite">Andreea Popescu</p>
      <p class="text-meta text-pencil">Contabil</p>
    </div>
  </aside>
  <div class="pl-sidebar">
    <main class="mx-auto max-w-content px-10 py-10">
      <router-outlet />
    </main>
  </div>
</div>
